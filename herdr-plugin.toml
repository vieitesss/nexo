id = "nexo"
name = "nexo"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Open nexo's tabbed terminal UI in Herdr popups."
platforms = ["linux", "macos"]

[[actions]]
id = "tui"
title = "Open nexo TUI"
contexts = ["workspace", "tab", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "nexo", "--entrypoint", "tui"]

[[actions]]
id = "tui-agents"
title = "Open nexo agents"
contexts = ["workspace", "tab", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "nexo", "--entrypoint", "tui-agents"]

[[actions]]
id = "tui-containers"
title = "Open nexo containers"
contexts = ["workspace", "tab", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "nexo", "--entrypoint", "tui-containers"]

[[actions]]
id = "tui-projects"
title = "Open nexo projects"
contexts = ["workspace", "tab", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "nexo", "--entrypoint", "tui-projects"]

# Record native workspace focus transitions so `nexo previous` and
# `nexo remote previous` observe navigation performed outside nexo. These are
# status/history hooks, not key bindings: keys stay in the user's Herdr config.
[[events]]
on = "workspace.focused"
command = ["nexo", "--backend=herdr", "focus"]

[[events]]
on = "pane.focused"
command = ["nexo", "--backend=herdr", "focus"]

[[panes]]
id = "tui"
title = "nexo TUI"
placement = "popup"
width = "100%"
height = "100%"
command = ["nexo", "--backend=herdr", "tui"]

[[panes]]
id = "tui-agents"
title = "nexo agents"
placement = "popup"
width = "100%"
height = "100%"
command = ["nexo", "--backend=herdr", "tui", "agents"]

[[panes]]
id = "tui-containers"
title = "nexo containers"
placement = "popup"
width = "100%"
height = "100%"
command = ["nexo", "--backend=herdr", "tui", "containers"]

[[panes]]
id = "tui-projects"
title = "nexo projects"
placement = "popup"
width = "100%"
height = "100%"
command = ["nexo", "--backend=herdr", "tui", "projects"]
